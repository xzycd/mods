<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mochi, the pocket pet">
<defs><radialGradient id="body" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#FFF6FA"/><stop offset=".55" stop-color="#FFD9E8"/><stop offset="1" stop-color="#FFB3D0"/></radialGradient>
<radialGradient id="aura"><stop offset="0" stop-color="#FF6FA5" stop-opacity=".42"/><stop offset="1" stop-color="#FF6FA5" stop-opacity="0"/></radialGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17151A"/><stop offset="1" stop-color="#0B0B0C"/></linearGradient><style>.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:32px 50px}
.wag{animation:wag 2.6s ease-in-out infinite;transform-origin:50px 45px}
.shadow{animation:shadow 2.6s ease-in-out infinite;transform-origin:32px 52px}
.blink{animation:blink 4.2s infinite;transform-origin:32px 31px}
.twinkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.t2{animation-delay:.9s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.6px) scale(.97,1.03)}}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
